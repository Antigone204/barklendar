# 包含 Flutter 官方推荐的基础规则集。
include: package:flutter_lints/flutter.yaml

analyzer:
  # 【保持严格】这些设置能保证你的代码逻辑是“硬朗”的，防止类型相关的 Bug。
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  # 排除生成文件
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/generated_plugin_registrant.dart"

  errors:
    # 【保留】Widget 没写 Key 依然报错，这有助于防止 Widget 树更新时的隐形 Bug。
    use_key_in_widget_constructors: error
    
    # 【已删除】avoid_print: error 
    # 解释：删除了这行，现在 print 只是普通的建议（或根据下面 linter 规则忽略），不会阻止你运行代码。

linter:
  rules:
    # --- 降噪与开发体验优化 (本次主要修改) ---
    always_specify_types: false         # 【关键修改】设为 false。现代 Dart 类型推断很强，没必要到处写类型，这将消除你 80% 的 Info。
    prefer_final_locals: false          # 【建议修改】设为 false。开发初期变量经常变动，强制 final 会让你改代码很累。
    avoid_print: false                  # 【建议修改】设为 false。允许使用 print 进行调试。上线前记得改回 true 或清理 print。

    # --- 代码风格 (Style) ---
    prefer_single_quotes: true          # 统一单引号
    require_trailing_commas: true       # 尾逗号（强烈建议保留，方便格式化）
    unnecessary_brace_in_string_interps: true
    unnecessary_parenthesis: true
    cascade_invocations: true
    
    # --- 性能与最佳实践 ---
    prefer_final_fields: true           # 类成员变量建议 final，这通常是对的。
    avoid_redundant_argument_values: true
    avoid_returning_null_for_void: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    depend_on_referenced_packages: true
    avoid_web_libraries_in_flutter: true

    # --- Const 规则 (保留，dart fix 能自动修，性能也好) ---
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_constructors_in_immutables: true
    
    # --- 重新确认 ---
    use_key_in_widget_constructors: true