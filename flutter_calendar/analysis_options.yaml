# 包含 Flutter 官方推荐的基础规则集。这是所有规则的基石。
include: package:flutter_lints/flutter.yaml

analyzer:
  # 开启 Dart 最严格的类型检查模式，能帮你避免很多潜在的类型转换错误。
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  # 在代码分析时，排除所有自动生成的文件。我们不关心这些文件的代码风格。
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/generated_plugin_registrant.dart"

  # 你可以在这里将特定的警告（warning）提升为错误（error）。
  # 这意味着如果代码违反了这些规则，分析器会报错，这在 CI/CD 环境中非常有用。
  errors:
    # 示例：如果一个 Widget 构造函数缺少 key，就直接报错。
    use_key_in_widget_constructors: error
    # 示例：如果 print() 语句被提交，就直接报错。
    avoid_print: error


# Linter 规则配置：在这里我们开启更多有益的规则。
linter:
  rules:
    # --- 代码风格 (Style) ---
    always_specify_types: true          # 鼓励为变量明确指定类型，增强代码可读性。
    prefer_single_quotes: true        # 统一使用单引号来定义字符串。
    require_trailing_commas: true     # 【强烈推荐】要求所有多行参数列表/集合都以逗号结尾。这能让 Git Diff 更清晰，并且方便列表的增删。
    unnecessary_brace_in_string_interps: true # 移除字符串插值中不必要的大括号。
    unnecessary_parenthesis: true     # 移除不必要的括号。
    cascade_invocations: true           # 在可能的情况下，使用级联运算符(..)让代码更简洁。
    
    # --- 性能与最佳实践 (Performance & Best Practices) ---
    prefer_final_fields: true           # 鼓励类中的字段尽可能使用 final，拥抱不可变性。
    prefer_final_locals: true           # 鼓励局部变量尽可能使用 final。
    avoid_redundant_argument_values: true # 避免传递与默认值相同的参数。
    avoid_returning_null_for_void: true # 避免在返回类型为 void 的函数中返回 null。
    avoid_slow_async_io: true           # 避免在异步函数中使用同步的 IO 操作。
    cancel_subscriptions: true          # 确保所有 StreamSubscription 都在不再需要时被取消，防止内存泄漏。
    depend_on_referenced_packages: true # 确保所有在代码中 import 的包都在 pubspec.yaml 中被声明。
    
    # --- Riverpod/Provider 相关的推荐规则 ---
    avoid_web_libraries_in_flutter: true # 防止在 Flutter 项目中误用 dart:html 等 Web 库。

    # --- 注释掉的规则（可以根据团队习惯决定是否开启）---
    # public_member_api_docs: true      # 要求所有公开的成员（方法、变量）都必须有文档注释。对于库项目非常有用。
    
    # 开启所有 const 相关的规则，以获取最佳性能
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_constructors_in_immutables: true

    # 之前被你禁用的规则，现在都重新开启，以保证代码质量
    use_key_in_widget_constructors: true
    avoid_print: true # 在开发时可以临时注释掉这一行，但合并代码前一定要打开