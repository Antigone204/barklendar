name: ai_smart_calendar
description: "AI-powered calendar app with natural language scheduling and smart reminders"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- 核心工具 ---
  # 窗口管理 (桌面端防卡死必备)
  window_manager: ^0.4.3
  
  # 基础 UI 图标
  cupertino_icons: ^1.0.6
  
  # 国际化与格式化
  flutter_localizations:
    sdk: flutter
  # 【修复1】：升级 intl 到 0.20.0 以匹配最新的 Flutter SDK
  intl: ^0.20.0 
  
  # 动画
  lottie: ^2.7.0

  # --- 日历核心 ---
  table_calendar: ^3.0.9
  syncfusion_flutter_calendar: ^28.1.38

  # --- 架构 ---
  flutter_riverpod: ^2.3.6
  go_router: ^7.0.0
  flutter_adaptive_scaffold: ^0.3.2

  # --- 网络 ---
  dio: ^5.7.0
  http: ^1.2.0

  # --- AI 能力 ---
  speech_to_text: ^6.4.0
  flutter_tts: ^3.6.3

  # --- 通知与时间 ---
  flutter_local_notifications: ^19.4.1
  # 【修复2】：升级 timezone 到 0.10.0 以匹配 flutter_local_notifications
  timezone: ^0.10.0

  # --- 数据存储 ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # --- 主题与样式 ---
  flutter_colorpicker: ^1.0.3
  flex_color_scheme: ^8.0.0
  flutter_timezone: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.0
  flutter_gen_runner: ^5.4.0
  test: ^1.26.2

flutter:
  uses-material-design: true
  generate: true