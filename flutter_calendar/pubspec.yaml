name: ai_smart_calendar
description: "AI-powered calendar app with natural language scheduling and smart reminders"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 基础 UI
  cupertino_icons: ^1.0.6
  flutter_localizations:
    sdk: flutter
  intl: any 
  lottie: ^2.7.0

  # 日历组件
  table_calendar: ^3.0.9
  syncfusion_flutter_calendar: ^28.1.38

  # 状态管理 & 路由
  flutter_riverpod: ^2.3.6
  go_router: ^7.0.0

  # 网络请求（AI 调用用它就行）
  dio: ^5.7.0

  # 语音 / TTS
  speech_to_text: ^6.4.0
  flutter_tts: ^3.6.3

  # 通知 / 时间
  flutter_local_notifications: ^19.4.1
  flutter_native_timezone: ^2.0.0

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # 本地安全存储（保存 token 等）
  flutter_secure_storage: ^9.0.0

  # 颜色选择器
  flutter_colorpicker: ^1.0.3

  # 动态主题生成
  flex_color_scheme: ^8.0.0

  # 基础 http (备用)
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.0
  flutter_gen_runner: any
  test: ^1.26.2

flutter:
  uses-material-design: true
  generate: true

  # assets:
  #   - assets/ai_voices/
  #   - assets/animations/
  #   - assets/notification_sounds/
